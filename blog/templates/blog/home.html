<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Django Blog</title>
</head>
<body>
    <h1>Welcome to My Django Blog</h1>
    <p>This is the home page of my blog.</p>

    <h2>Published Posts:</h2>
    <ul>
        {% for post in object_list %}
            <li>
                <strong>{{ post.title }}</strong> by {{ post.author.username }} <br>
                {{ post.excerpt|default:post.content|truncatechars:100 }}
            </li>
        {% empty %}
            <li>No posts published yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
