{% extends "base.html" %}

{% block head_title %}Log Out{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8 mt-3 offset-md-2 text-center">
            <h3>Log Out</h3>
            <p>Are you sure you want to log out?</p>
            
            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <button class="btn btn-signup" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
